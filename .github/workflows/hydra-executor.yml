name: Hydra PSIE Executor

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Hydra Heartbeat
        run: python scripts/hydra_heartbeat.py
      - name: Run Hydra Patch Runner
        run: python scripts/hydra_patch_runner.py
      - name: Commit and Push changes
        run: |
          git config user.name 'Hydra PSIE'
          git config user.email 'hydra@psie.local'
          git add -A
          git diff --staged --quiet || git commit -m 'Auto-update: Hydra Heartbeat + Patch Runner execution'
          git push