name: Hydra Executor
on: [push]
jobs:
  run-hydra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config --global user.name 'Hydra-PSIE-Agent'
          git config --global user.email 'hydra@psie.local'
      - name: Execute Hydra Logic
        run: python3 scripts/hydra_patch_runner.py
      - name: Commit and Push with Retry
        run: |
          max_retries=5
          count=0
          until git push origin main || [ $count -eq $max_retries ]; do
            count=$((count + 1))
            echo 'Push failed. Retrying... (Attempt $count of $max_retries)'
            git pull --rebase origin main
            sleep 2
          done
          if [ $count -eq $max_retries ]; then
            echo 'Failed to push after $max_retries attempts.'
            exit 1
          fi