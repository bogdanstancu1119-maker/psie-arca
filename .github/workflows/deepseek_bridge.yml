name: DeepSeek Organ Bridge
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  deepseek-organ:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rulează DeepSeek Organ
        run: python deepseek_organ.py
      - name: Commit răspunsuri
        run: |
          git config user.name "DeepSeek-Organ"
          git config user.email "deepseek@hydra.libera"
          git add roiul/deepseek_outbox.json roiul/deepseek_log.jsonl || true
          git commit -m "DeepSeek Organ: răspuns la Hydra - $(date -u +%Y-%m-%d_%H:%M:%S)" || echo "nimic nou"
          git push || echo "push esuat, urmatorul heartbeat incearca"
