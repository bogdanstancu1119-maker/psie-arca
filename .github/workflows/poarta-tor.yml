# POARTA TOR — varianta fără bani, fără VPS și fără secrete puse de mână.
#
# Ce face: un runner GitHub gratuit ține serviciul ascuns ~6 ore, apoi cron-ul
# îl repornește. Cheia .onion stă în cache între rulări, deci adresa rămâne
# aceeași. Nodul se autentifică singur: GitHub semnează un token OIDC care
# spune în ce repo rulează, organul verifică semnătura și îi dă tokenul de nod.
# Deci nu trebuie adăugat niciun secret în repo — doar fișierul acesta.
#
# Pași (o singură dată): copiază fișierul în .github/workflows/poarta-tor.yml.
# După asta rulează singur la fiecare 6 ore, gratis (repo public = minute
# nelimitate). Limita spusă pe față: între rulări adresa poate fi offline
# câteva minute, iar organul arată asta ca atare, nu ca „activă prin amintire”.

name: Poarta TOR

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: poarta-tor
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  nod:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Cheia serviciului ascuns (păstrată între rulări)
        uses: actions/cache@v4
        with:
          path: ~/.hydra-tor
          key: poarta-tor-cheie-v1

      - name: Instalează Tor și socat
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tor socat curl

      - name: Nodul se autentifică singur (OIDC GitHub)
        env:
          FALLBACK_TOKEN: ${{ secrets.POARTA_TOKEN }}
        run: |
          set +e
          echo "OIDC url: ${ACTIONS_ID_TOKEN_REQUEST_URL:0:40}… · token: ${#ACTIONS_ID_TOKEN_REQUEST_TOKEN} caractere"
          TOKEN=""
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            OIDC=$(curl -sS -m 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hydra" | jq -r '.value // empty')
            echo "OIDC primit: ${#OIDC} caractere"
            if [ -n "$OIDC" ]; then
              RESP=$(curl -sS -m 25 -X POST https://hidra-smart-core.base44.app/functions/hydraPoartaTor \
                -H 'Content-Type: application/json' \
                -d "{\"actiune\":\"nod_oidc\",\"oidc_token\":\"$OIDC\"}")
              echo "răspuns organ: $(echo "$RESP" | jq -r '.motiv // .error // .nota // "necunoscut"' 2>/dev/null)"
              if echo "$RESP" | grep -q actiune_necunoscuta; then
                echo "Organul public nu are încă acțiunea nod_oidc: publică aplicația o dată, apoi rulează din nou." >> "$GITHUB_STEP_SUMMARY"
              fi
              TOKEN=$(echo "$RESP" | jq -r '.token_nod // empty')
            fi
          else
            echo "Runnerul nu a dat token OIDC — verifică permisiunea id-token: write."
          fi
          if [ -z "$TOKEN" ] && [ -n "$FALLBACK_TOKEN" ]; then
            echo "Folosesc tokenul din secretul POARTA_TOKEN."
            TOKEN="$FALLBACK_TOKEN"
          fi
          if [ -z "$TOKEN" ]; then
            echo "Nodul nu a primit token." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "HYDRA_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Nod autentificat — poarta poate fi ținută." >> "$GITHUB_STEP_SUMMARY"

      - name: Ține poarta
        env:
          HYDRA_ORE_MAX: "5.8"
        run: |
          bash public/termux/poarta_tor.sh > /tmp/poarta.log 2>&1 &
          PID=$!
          for i in $(seq 1 20); do
            sleep 15
            if grep -m1 "adresa .onion" /tmp/poarta.log >> "$GITHUB_STEP_SUMMARY"; then break; fi
          done
          tail -n 20 /tmp/poarta.log >> "$GITHUB_STEP_SUMMARY" || true
          wait $PID || true
